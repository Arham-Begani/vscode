name: VS Code 141801 browser regression
on:
  push:
    branches: [oss-validation/141801]
permissions:
  contents: read
concurrency:
  group: vscode-141801-validation
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vscode
          ref: 13d3bd453cfcb803650fa2a5cb18ca5c47f534a2
          path: vscode
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: vscode/.nvmrc
          cache: npm
          cache-dependency-path: |
            vscode/package-lock.json
            vscode/build/package-lock.json
      - name: Apply regression patch
        working-directory: vscode
        run: git apply ../regression.patch
      - name: Install browser and build dependencies
        working-directory: vscode
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix build --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build client
        working-directory: vscode
        run: npm run build-fast -- --client-only
      - name: Browser regression tests
        working-directory: vscode
        run: npm run test-browser-no-install -- --browser chromium --run src/vs/workbench/api/test/browser/mainThreadCustomEditors.test.ts
      - name: Lint changed files
        if: matrix.os == 'ubuntu-24.04'
        working-directory: vscode
        run: npm run eslint -- src/vs/workbench/api/browser/mainThreadCustomEditors.ts src/vs/workbench/contrib/customEditor/browser/customEditorInput.ts src/vs/workbench/api/test/browser/mainThreadCustomEditors.test.ts
      - name: Client type check
        if: matrix.os == 'ubuntu-24.04'
        working-directory: vscode
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          node build/npm/electronTypes.ts
          npm run typecheck-client
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-evidence-${{ matrix.os }}
          path: vscode/.build/logs
          if-no-files-found: ignore
